name: Quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run regression tests
        run: npm test

      - name: Validate Expo project
        run: npx expo-doctor

      - name: Export Web bundle
        run: npx expo export --platform web --output-dir /tmp/melo-web

      - name: Export iOS bundle
        run: npx expo export --platform ios --output-dir /tmp/melo-ios

      - name: Export Android bundle
        run: npx expo export --platform android --output-dir /tmp/melo-android
